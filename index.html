  Version 1.8.0   (2026-11-20)  - Add the December-only Christmas area.

  Version 1.6.2   (2026-09-29)  - Embed large artwork at its drawn size (HTML 12.2MB -> 1.5MB) so

                                  drone/heartbeat theme while ZANPARN approaches; shorten the

  Version 1.5.0   (2026-09-26)  - Add seaside/snowfield regions and day/night cycles;

                                  replace random speed with varied ZANPARN encounters;
                                  refine rendering and title readability; add idle attract demo.
                                  Unreleased iteration notes are retained in Git history.
  Version 1.2.3   (2026-08-27)  - Random-speed easter egg: no new obstacles spawn while the score
                                  is within 50 points of the trigger (RANDOM_SPEED_SCORE), on either
                                  side. Players were reading the sudden speed change as a "flash =
                                  instant death" moment, because whatever obstacle already happened
                                  to be in flight would suddenly approach at an unpredictable pace
                                  right as the flash/banner fired. Clearing the trigger point itself
                                  (instead of freezing speed or obstacles at the trigger and letting
                                  both loose again later, which just moves the same cliff a couple
                                  seconds down the road) means the flash always lands on a clear
                                  screen, and by the time obstacles resume the player has already
                                  had a few seconds to feel out the new pace.
  Version 1.2.2   (2026-07-28)  - Game-over button order swapped: "もう一度/Retry" now sits on
                                  the right and "タイトル/Title" on the left. Most players hold
                                  the phone one-handed with their right thumb, so the primary
                                  action (retry) is now in the more reachable spot, next to the
                                  share button.
  Version 1.2.1   (2026-06-14)  - Share button fix + format: the share button is now a real
                                  <a target="_blank"> whose href is built on game over, so a
                                  tap navigates directly (mobile/iOS blocked the old
                                  programmatic window.open even on the bare page). Share text
                                  is now 3 lines (headline / URL / hashtags), all inside the
                                  tweet `text` so the line breaks survive; hashtags reordered
                                  to #CHOSUJUMPHEAVEN #ちょすのジャンプ天国.
  Version 1.2.0   (2026-06-14)  - Expert easter egg: once the score passes 10000, the run
                                  speed stops climbing steadily and instead re-rolls a random
                                  target every 1.5-2.5s within the normal 360-760 range,
                                  easing toward it (obstacle spacing + jump timing stay fair).
                                  Triggers a one-shot cue: rising arpeggio SFX + a brief
                                  white screen flash + a "RANDOM SPEED!?" banner (Pixelify
                                  Sans, shown on both languages). Lasts the rest of the run.
  Version 1.1.0   (2026-06-14)  - Share-to-X button on the game-over screen: a small X-logo
                                  icon button in the bottom-right corner (mirrors the mute
                                  button), kept out of the main button row so it never wraps
                                  / breaks the layout on mobile. Posts your score + Nikuman
                                  count via an intent URL, with both #ちょすのジャンプ天国 and
                                  #CHOSUJUMPHEAVEN tags and a link back to the OGP page.
                                  JA/EN post text.
  Version 1.0.4   (2026-06-13)  - Tap anywhere again: v1.0.3 moved the jump listener to
                                  #stage, which lost taps on the letterbox margins itch
                                  adds. Moved it to #wrap (fills the viewport) so the whole
                                  screen jumps, as it did pre-itch.
  Version 1.0.3   (2026-06-13)  - Real mobile-tap fix: iOS Safari only bubbles taps to
                                  window for "clickable" elements, so the window jump
                                  listener never fired on the (non-clickable) canvas /
                                  overlays inside the itch iframe — only the mute/lang
                                  buttons (own listeners) worked. Moved the jump listener
                                  onto #stage and gave it cursor:pointer.
  Version 1.0.2   (2026-06-13)  - Fix v1.0.1 regression: the added window touchstart
                                  fallback double-fired with pointerdown on iOS, so taps
                                  on the lang / retry / title buttons leaked to the window
                                  jump handler (game started instead). Reverted to
                                  pointerdown-only (it fires fine in the itch iframe);
                                  kept touch-action:none, which was the real tap fix.
  Version 1.0.1   (2026-06-13)  - Mobile tap fix: touch-action:none on body/canvas +
                                  touchstart fallback (debounced). NOTE: the touchstart
                                  fallback caused a button double-fire on iOS; see 1.0.2.
  Version 1.0.0   (2026-06-12)  - First complete release.
  Version 0.12.1  (2026-06-11)  - Updated title logo (title.svg); HUD digits switched to
                                  Silkscreen font for legibility (labels stay Pixelify).
  Version 0.12.0  (2026-06-09)  - English / Japanese language toggle (JA|EN segment by
                                  the mute button; auto-detect from browser, saved in
                                  localStorage). NOTE: not published on GitHub Pages —
                                  for personal-server check / itch.io release.
  Version 0.11.0  (2026-06-06)  - Web Audio SFX (jump / footsteps / nikuman get /
                                  game over) + mute toggle; fewer & more uniform
                                  clouds; loading screen (ぽにょん nikuman);
                                  favicon / apple-touch-icon link tags.
  Version 0.10.1  (2026-06-06)  - Title ちょす size matches in-game on SP; instruction
                                  panel split into 2 lines (keys row centered, 2nd line
                                  top margin); per-screen SP logo margins.
  Version 0.10.0  (2026-06-06)  - Visual overhaul: image assets (logos, parallax
                                  mountains, ground tiles, image obstacles), biomes
                                  (ground01=rock+tree / ground02=rock+cactus), new
                                  fonts, PC(4:3)/SP(8:7) width breakpoint, phone
                                  landscape lock, SP difficulty scaling, +100 score
                                  popup, fixed-width HUD digits.
  Images live in assets/ next to index.html (hashed names); build.py injects the

<style>
  :root {
    --cream:   #fbf5e7;
    --pink:    #f1beb9;
    --mint:    #b8e9e5;
    --yellow:  #ffe555;
    --brown:   #412721;
    --sky-top: #afe6ff;
    --sky-bot: #d3f6ff;
    --pad: clamp(10px, 3vw, 20px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--brown);
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--brown);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;          /* don't let mobile treat taps as scroll/zoom gestures */
  }
  #wrap {
    width: 100%;
    height: 100%;
    padding: var(--pad);
    cursor: pointer;   /* whole viewport taps to jump; iOS only delivers taps to "clickable" elements */
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 40%),
      var(--brown);
  }
  /* PC: 4:3 */
  #stage {
    position: relative;
    width: min(100%, calc((100vh - var(--pad) * 2) * 4 / 3));
    width: min(100%, calc((100dvh - var(--pad) * 2) * 4 / 3));
    max-width: 800px;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 0 0 6px var(--cream), 0 0 0 10px var(--brown);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bot));
  }
  /* SP: a little taller (≈8:7) */
  @media (max-width: 700px) {
    #stage {
      width: min(100%, calc((100vh - var(--pad) * 2) * 686 / 600));
      width: min(100%, calc((100dvh - var(--pad) * 2) * 686 / 600));
      aspect-ratio: 686 / 600;
    }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;           /* backing store matches the screen; see configureMode */
  }

  /* ---- Overlays ---- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    gap: 20px;                 /* ~20px between the windows */
    z-index: 5;
  }
  .overlay.hidden { display: none; }

  .logo { height: auto; image-rendering: auto; filter: drop-shadow(0 4px 0 rgba(65,39,33,.15)); margin-bottom: 10px; } /* gameover: +gap = ~30px below the logo */
  .logo-title    { width: min(66%, 540px); margin-top: -6%; margin-bottom: 0; } /* title logo -> subtitle = gap (20px) */
  .logo-gameover { width: min(46%, 360px); }
  @media (max-width: 700px) {
    .overlay { gap: 14px; }
    .logo-title    { width: 86%; }
    .logo-gameover { width: 62%; margin-bottom: 4px; } /* keep a little space below the GAME OVER logo on SP */
  }

  .subtitle {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 3vw, 22px);
    color: var(--brown);
    background: var(--yellow);
    padding: 5px 18px;
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(65,39,33,.18);
    margin-bottom: 10px;   /* subtitle -> instruction window = gap + 10 = ~30px */
  }

  .panel {
    background: rgba(251,245,231,.94);
    border: 3px solid var(--brown);
    border-radius: 14px;
    padding: 10px 16px;
    box-shadow: 0 6px 0 rgba(65,39,33,.22);
    max-width: 92%;
  }
  /* keep the score window a stable size regardless of the message inside */
  #overScreen .panel { min-width: 230px; font-weight: 700; } /* labels = 700 */
  .num { font-weight: 900; }                                  /* numbers = 900 */
  .hint {
    font-size: clamp(12px, 2.4vw, 15px);
    line-height: 1.6;
    font-weight: 500;
  }
  .hint p { margin: 0; }
  /* keycaps + text on one line, vertically centered together */
  .hint-keys {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  #startScreen.seasonal { gap: 10px; }
  #startScreen.seasonal .subtitle { margin-bottom: 4px; }
  .seasonal-notice { color: #75405c; font-weight: 700; font-size: .9em; }
  .hint p.hint-sub { margin-top: 0.15em; } /* breathing room above the 2nd line (beats .hint p) */
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82em;     /* same on both keys -> identical box height */
    height: 1.9em;
    min-width: 1.7em;
    padding: 0 8px;
    margin: 0 2px;
    line-height: 1;
    vertical-align: middle;
    background: var(--mint);
    border: 2px solid var(--brown);
    border-radius: 6px;
    box-shadow: 0 2px 0 var(--brown);
  }
  .key-space { font-family: 'Silkscreen', sans-serif; }
  .key-up    { font-family: 'DotGothic16', sans-serif; }

  .start-prompt {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border: 2px solid var(--cream);
    border-radius: 8px;
    background: var(--brown);
    color: var(--cream);
    box-shadow: 0 3px 0 rgba(65,39,33,.25);
    font-weight: 700;
    font-size: clamp(12px, 2.5vw, 18px);
    line-height: 1.4;
  }
  .start-prompt i {
    color: var(--yellow);
    font-size: .8em;
    animation: start-cue 1.4s steps(2, start) infinite;
  }
  @keyframes start-cue { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    .start-prompt i { animation: none; }
  }

  #demoNotice {
    position: absolute; top: 14%; left: 8%; right: 8%; z-index: 6;
    text-align: center; pointer-events: none; color: var(--brown);
  }
  #demoNotice.hidden { display: none; }
  #demoNotice strong { font-family: 'Silkscreen', sans-serif; font-size: clamp(22px, 5vw, 36px); }
  #demoNotice .demo-panel { display: inline-block; background: var(--cream);
    border: 2px solid var(--brown); border-radius: 10px; padding: 8px 16px; }
  #demoNotice p { font-size: clamp(11px, 2.5vw, 15px); font-weight: 700; margin-top: 3px; }

  .mute {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 7;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--brown);
    background: rgba(251,245,231,.85);
    border: 2px solid var(--brown);
    border-radius: 8px;
    box-shadow: 0 2px 0 var(--brown);
    cursor: pointer;
    pointer-events: auto;
  }
  .mute:active { transform: translateY(2px); box-shadow: 0 0 0 var(--brown); }

  /* language toggle (segmented JA | EN) — title screen only, bottom-right */
  .lang {
    position: absolute;
    right: 12px;
    bottom: 10px;
    z-index: 7;
    display: flex;
    height: 30px;
    border: 2px solid var(--brown);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 0 var(--brown);
    background: rgba(251,245,231,.85);
    pointer-events: auto;
  }
  .lang button {
    border: 0;
    background: transparent;
    color: var(--brown);
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 0 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .lang button + button { border-left: 2px solid var(--brown); }
  .lang button.active { background: var(--yellow); }

  .version {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 26px;
    font-family: 'Silkscreen', sans-serif;
    font-weight: 400;
    font-size: clamp(10px, 2vw, 13px);
    color: var(--brown);
    opacity: .45;
    pointer-events: none;
  }
  .version .v { font-family: 'Pixelify Sans', sans-serif; font-weight: 700; }

  .copyright {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 10px;
    font-family: 'Pixelify Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(8px, 1.6vw, 11px);
    white-space: nowrap;
    color: var(--brown);
    opacity: .4;
    pointer-events: none;
  }

  /* title-screen chosu shown in front of the instructions */
  #titleChosu {
    position: absolute;
    left: 15%;            /* = CHOSU_X / W */
    bottom: 6%;           /* = (600 - ACTOR_FEET) / 600, so it matches the in-game stance */
    width: 12%;           /* PC: 96 / 800 — same as the in-game ちょす */
    height: auto;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 6px 0 rgba(65,39,33,.12));
  }
  @media (max-width: 700px) {
    #titleChosu { width: 14%; }  /* SP: 96 / 686 — match the (relatively bigger) in-game ちょす */
  }
  #titleNikuman {
    position: absolute;
    right: 13%;
    bottom: 26%;
    width: 9%;
    height: auto;
    pointer-events: none;
    transform-origin: center center;
    filter: drop-shadow(0 6px 0 rgba(65,39,33,.12));
    animation: ponyon 1.6s ease-in-out infinite;
  }
  @keyframes ponyon {
    0%   { transform: translateY(0)    scale(1, 1); }
    25%  { transform: translateY(8px)  scale(1.1, 0.9); }
    50%  { transform: translateY(0)    scale(1, 1); }
    75%  { transform: translateY(-8px) scale(0.9, 1.1); }
    100% { transform: translateY(0)    scale(1, 1); }
  }

  .btnrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 2.8vw, 18px);
    color: var(--brown);
    background: var(--yellow);
    border: 3px solid var(--brown);
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--brown);
    transition: transform .05s ease, box-shadow .05s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown); }
  .btn.secondary { background: var(--mint); }
  /* share to X — small icon button, mirrors the mute button (bottom-right of the game-over screen) */
  .share-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 7;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--cream);
    background: #1c1c1e;
    border: 2px solid var(--brown);
    border-radius: 8px;
    box-shadow: 0 2px 0 var(--brown);
    cursor: pointer;
    pointer-events: auto;
    text-decoration: none;   /* it's now an <a> */
  }
  .share-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--brown); }
  .key-hint { font-size: clamp(11px, 2.4vw, 14px); color: var(--brown); opacity: .8; font-weight: 500; }

  /* ZANPARN advance warning (no full-screen flash). */
  #cueBanner {
    position: absolute;
    top: 34%; left: 50%;
    transform: translate(-50%, -50%) scale(.6);
    z-index: 9;
    font-family: 'Pixelify Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 5.5vw, 40px);
    color: var(--brown);
    background: var(--yellow);
    border: 3px solid var(--brown);
    border-radius: 14px;
    padding: 6px 20px;
    box-shadow: 0 4px 0 rgba(65,39,33,.3);
    white-space: nowrap;
    max-width: 90%;
    opacity: 0;
    pointer-events: none;
  }
  #cueBanner.show { animation: cueBanner 1.4s ease-out; }
  @keyframes cueBanner {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    14%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
    28%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    78%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }

  /* ---- HUD ---- */
  #hud {
    position: absolute;
    top: 10px; left: 14px; right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: 'Pixelify Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 3vw, 20px);
    color: var(--brown);
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
    z-index: 4;
    pointer-events: none;
    letter-spacing: .5px;
  }
  #hud.night { color: #fff5dc; text-shadow: 1px 2px 0 #243451; }
  #hud.night .hi { color: #ffda87; }
  #hud .right { text-align: right; line-height: 1.15; }
  #hud .hi { color: #d98a2b; }
  /* fixed-width digit cells so numbers don't jitter as values change */
  #hud .d { display: inline-block; width: 0.64em; text-align: center; font-family: 'Silkscreen', sans-serif; font-weight: 400; }
  /* Silkscreen's "1" sits left in its advance, leaving a gap on the right; nudge it back */
  #hud .d.one { transform: translateX(0.07em); }
  .nikuman-count { display: inline-flex; align-items: center; gap: 3px; }
  .nikuman-count .x { position: relative; top: 2px; }
  .nikuman-count img { height: 1.5em; width: auto; vertical-align: middle; }

  /* ---- Phone landscape lock ---- */
  #rotateLock {
    display: none;
    position: fixed; inset: 0;
    background: var(--brown);
    color: var(--cream);
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
  }
  #rotateLock i { font-size: 16vw; animation: tilt 1.6s ease-in-out infinite; }
  #rotateLock .msg { font-size: 5vw; line-height: 1.5; }
  @keyframes tilt { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
    #rotateLock { display: flex; }
  }

  /* ---- Loading screen ---- */
  #loading {
    position: fixed; inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;

<script>
(function () {
  "use strict";

  // ===== Assets (relative URLs into assets/, injected by build.py) =====
  const ASSETS = {"chosu00": "assets/chosu00.fc3534cc75.webp", "chosu01": "assets/chosu01.fe17568c33.webp", "chosu02": "assets/chosu02.85ac6b8f2e.webp", "chosu03": "assets/chosu03.2f5d45761a.webp", "nikuman00": "assets/nikuman00.ab3c9dbeac.webp", "zanparn": "assets/zanparn.a21227cc18.webp", "beach/driftwood": "assets/beach-driftwood.74b99d2d0f.webp", "beach/shell": "assets/beach-shell.106c8b5321.webp", "beach/variants": "assets/beach-variants.c22bda2b92.webp", "christmas/obstacles": "assets/christmas-obstacles.b4fa501717.webp", "cloud/cloud01": "assets/cloud-cloud01.e117bf1e5e.webp", "cloud/cloud02": "assets/cloud-cloud02.8480536ff1.webp", "cloud/cloud03": "assets/cloud-cloud03.7ffd00740a.webp", "desert/cactus": "assets/desert-cactus.3a40f7b79a.webp", "desert/variants": "assets/desert-variants.adaf2b3398.webp", "halloween/obstacles": "assets/halloween-obstacles.a64c10795c.webp", "logo/gameover": "assets/logo-gameover.ef27ed49aa.webp", "logo/gameover.svg": "assets/logo-gameover.7ad318dba3.svg", "logo/title": "assets/logo-title.9dc530c0b4.webp", "logo/title.svg": "assets/logo-title.455f53da4e.svg", "obstacles/wide": "assets/obstacles-wide.c0bee20d42.webp", "plains/rock": "assets/plains-rock.3cee4f6fdf.webp", "plains/tree": "assets/plains-tree.26d420b631.webp", "plains/variants": "assets/plains-variants.fb86c19d7e.webp", "scenery/christmas": "assets/scenery-christmas.5da7d011ee.webp", "scenery/desert": "assets/scenery-desert.ede2252058.webp", "scenery/halloween": "assets/scenery-halloween.b736d00ba7.webp", "scenery/plains": "assets/scenery-plains.179398e0ef.webp", "scenery/seaside": "assets/scenery-seaside.f44ac4d9b1.webp", "scenery/snowfield": "assets/scenery-snowfield.5255c37edf.webp", "snow/rock": "assets/snow-rock.fa730489ee.webp", "snow/tree": "assets/snow-tree.2676debabc.webp", "snow/variants": "assets/snow-variants.926a4ae79d.webp"};
  const ASSET_SOURCE_SIZE = {"beach/driftwood": [1536, 1024], "beach/shell": [1374, 1145], "beach/variants": [1881, 836], "christmas/obstacles": [1536, 1024], "desert/cactus": [1086, 1448], "desert/variants": [1881, 836], "halloween/obstacles": [1536, 1024], "obstacles/wide": [1536, 1024], "plains/rock": [1402, 1122], "plains/tree": [1182, 1330], "plains/variants": [1881, 836], "scenery/christmas": [1536, 1024], "scenery/desert": [1536, 1024], "scenery/halloween": [1536, 1024], "scenery/plains": [1536, 1024], "scenery/seaside": [1536, 1024], "scenery/snowfield": [1536, 1024], "snow/rock": [1374, 1145], "snow/tree": [1086, 1448], "snow/variants": [1881, 836]};

  // Local calendar, every year; URL presence enables off-season photography.
  const SEASONS = { halloween: { month: 9 }, christmas: { month: 11 } };
  function isSeasonEnabled(key) {
    return new Date().getMonth() === SEASONS[key].month || new URLSearchParams(window.location.search).has(key);
  }
  function refreshSeasonalNotice() {
    let anyEnabled = false;
    for (const key of Object.keys(SEASONS)) {
      const enabled = isSeasonEnabled(key);
      document.getElementById(key + "Notice").hidden = !enabled;
      anyEnabled ||= enabled;
    }
    document.getElementById("startScreen").classList.toggle("seasonal", anyEnabled);
  }
  refreshSeasonalNotice();
  document.addEventListener("visibilitychange", refreshSeasonalNotice);

  // ===== Canvas =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const cloudLayer = document.createElement("canvas");
  const cloudCtx = cloudLayer.getContext("2d");
  const H = 600;

  // ===== DOM =====
  const elHud     = document.getElementById("hud");
  const elScore   = document.getElementById("score");
  const elHi      = document.getElementById("hiscore");
  const elNikuman = document.getElementById("nikumanCount");
  const elStart   = document.getElementById("startScreen");
  const elOver    = document.getElementById("overScreen");
  const elFinal   = document.getElementById("finalScore");
  const elFinalNikLine = document.getElementById("finalNikLine");
  const elFinalHi = document.getElementById("finalHi");
  const elHudNikuman   = document.getElementById("hudNikuman");
  const elBtnRestart   = document.getElementById("btnRestart");
  const elBtnTitle     = document.getElementById("btnTitle");
  const elBtnShare     = document.getElementById("btnShare");
  const elTitleNikuman = document.getElementById("titleNikuman");
  const elTitleChosu   = document.getElementById("titleChosu");
  const elMute         = document.getElementById("muteBtn");
  const elCueBanner    = document.getElementById("cueBanner");
  document.getElementById("logoTitle").src    = ASSETS["logo/title.svg"];
  document.getElementById("logoGameover").src  = ASSETS["logo/gameover.svg"];
  elHudNikuman.src     = ASSETS["nikuman00"];
  elTitleNikuman.src   = ASSETS["nikuman00"];
  elTitleChosu.src     = ASSETS["chosu00"];

  // ===== Image preload =====
  const IMG = {};
  let toLoad = 0, loaded = 0, allLoaded = false;
  for (const key in ASSETS) {
    if (/\.svg$/.test(key)) continue; // svg used only in <img>
    const im = new Image();
    toLoad++;
    im.onload = im.onerror = () => { if (++loaded >= toLoad) { allLoaded = true; checkReady(); } };
    im.src = ASSETS[key];
    im.sourceSize = ASSET_SOURCE_SIZE[key]; // set when build.py resized it
    IMG[key] = im;
  }
  function img(k) { return IMG[k]; }
  function ready(im) { return im && im.complete && im.naturalWidth; }
  // Source rectangles are written in original-artwork pixels; map them onto
  // the image in assets/, which build.py may have resized to its drawn size.
  function drawSource(im, sx, sy, sw, sh, dx, dy, dw, dh) {
    const s = im.sourceSize;
    const kx = s ? im.naturalWidth / s[0] : 1, ky = s ? im.naturalHeight / s[1] : 1;
    ctx.drawImage(im, sx * kx, sy * ky, sw * kx, sh * ky, dx, dy, dw, dh);
  }

  // ===== Audio (Web Audio synthesis — no audio files) =====
  let audioCtx = null, masterGain = null, muted = false;
  try { muted = localStorage.getItem("chosu_muted") === "1"; } catch (e) {}

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(audioCtx.destination);
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0;
    bgmGain.connect(masterGain);
  }
  function unlockAudio() {           // must run inside a user gesture
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  // one tone with optional frequency sweep + a quick attack/decay envelope
  function tone(o) {
    if (!audioCtx || muted || demoPlaying) return;
    const t = audioCtx.currentTime + (o.delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = o.type || "square";
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1 != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    const vol = o.vol != null ? o.vol : 0.4;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + o.dur + 0.03);
  }
  const sfxJump = () => tone({ type: "triangle", f0: 360, f1: 1000, dur: 0.18, vol: 0.5 });
  const sfxStep = () => tone({ type: "square", f0: runFrame ? 165 : 140, dur: 0.05, vol: 0.16 });
  const sfxGet  = () => { tone({ type: "square", f0: 680, dur: 0.08, vol: 0.4 });
                          tone({ type: "square", f0: 1020, dur: 0.13, vol: 0.4, delay: 0.075 }); };
  const sfxOver = () => { tone({ type: "sawtooth", f0: 500, f1: 130, dur: 0.5, vol: 0.45 });
                          tone({ type: "square", f0: 300, f1: 90, dur: 0.55, vol: 0.2, delay: 0.04 }); };
  // ZANPARN warning — rising 3-step arpeggio
  const sfxWarning = () => { tone({ type: "square",   f0: 300, f1: 760,  dur: 0.16, vol: 0.4 });
                          tone({ type: "square",   f0: 480, f1: 1100, dur: 0.18, vol: 0.4, delay: 0.11 });
                          tone({ type: "triangle", f0: 680, f1: 1500, dur: 0.22, vol: 0.45, delay: 0.23 }); };

  // ===== BGM (same synthesis as the SFX; scheduled a little ahead from the frame loop) =====
  // Plays only during a real run: silent on the title, the game-over screen and the idle demo.
  // Melody tokens are eighth notes: a note name, "-" holds the previous note, "." is a rest.
  const BGM_EIGHTH = 0.2;          // 150 bpm
  const BGM_VOL = 0.55;            // bgm bus level under masterGain, leaves room for the SFX
  const BGM_SONGS = {
    // C major, 16 bars (~25.6s): the promo-video theme, a lyrical answer, then a bridge.
    run: {
      mel: "C5 E5 G5 E5 C6 G5 E5 G5 | A4 C5 F5 C5 A5 F5 C5 F5 | G4 B4 D5 B4 G5 D5 B4 D5 | C5 E5 G5 C6 B5 G5 A5 B5 |" +
           "C6 - B5 G5 A5 - G5 E5 | F5 - E5 C5 D5 - C5 A4 | B4 D5 G5 - F5 E5 D5 B4 | C5 - G4 - C5 - - . |" +
           "A5 - E5 A5 C6 - B5 A5 | F5 - C5 F5 A5 - G5 F5 | G5 - D5 G5 B5 - A5 G5 | E5 G5 C6 G5 E5 C5 D5 E5 |" +
           "F5 E5 D5 C5 A4 - C5 F5 | G5 F5 E5 D5 B4 - D5 G5 | E5 D5 C5 E5 A5 - G5 E5 | F5 - E5 - D5 - G4 -",
      bass: "C3 F3 G3 C3 C3 F3 G3 C3 A2 F3 G3 C3 F3 G3 A2 G2",
      pluck: 0.9, lead: 0.2,
    },
    // ZANPARN encounters (same ominous language as the promo video): the tune drops out
    // under a swelling low drone, a heartbeat and sparse, sinking low notes.
    zan: {
      mel: "A3 - - - . . . . | G#3 - - - . . . . | F3 - - - . . . . | E3 - - - D#3 - - -",
      bass: "A1 A1 A1 A1",
      eerie: true,
    },
  };
  const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const noteHz = n => 440 * Math.pow(2, (NOTE_BASE[n[0]] + (n[1] === "#" ? 1 : 0) + 12 * (parseInt(n.slice(-1), 10) + 1) - 69) / 12);
  for (const song of Object.values(BGM_SONGS)) {
    const tokens = song.mel.replace(/\|/g, " ").trim().split(/\s+/);
    song.steps = tokens.map((tok, i) => {
      if (tok === "-" || tok === ".") return null;
      let len = 1; while (tokens[i + len] === "-") len++;
      return { f: noteHz(tok), len };
    });
    song.roots = song.bass.split(/\s+/).map(noteHz);
  }

  let bgmGain = null, noiseBuf = null;
  const bgm = { playing: false, song: "run", step: 0, next: 0, resume: 0 };
  function bgmVoice(t, type, f0, f1, dur, vol) {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (f1) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(bgmGain);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function bgmNoise(t, dur, vol, filterType, freq) {
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = filterType; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bgmGain);
    src.start(t); src.stop(t + dur + 0.02);
  }
  let drone = null;
  function droneStart(t) {
    bgmNoise(t, 0.5, 0.45, "lowpass", 260);            // the floor drops out
    bgmVoice(t, "sine", 120, 30, 0.6, 0.8);
    const lp = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    lp.type = "lowpass"; lp.frequency.setValueAtTime(180, t); lp.frequency.linearRampToValueAtTime(900, t + 3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 1.0);
    lp.connect(g); g.connect(bgmGain);
    const oscs = [55, 58.3].map(f => {                  // two detuned saws beat against each other
      const o = audioCtx.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * 1.5, t + 4);
      o.connect(lp); o.start(t); return o;
    });
    drone = { g, oscs };
  }
  function droneStop(t) {
    if (!drone) return;
    const { g, oscs } = drone; drone = null;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.3, t);
    g.gain.linearRampToValueAtTime(0, t + 0.3);
    for (const o of oscs) o.stop(t + 0.35);
  }
  function bgmPlayEerie(t, song, k) {
    const n = song.steps[k], beat = k % 8;
    if (n) {                                            // sinking low line + a quiet tritone above
      bgmVoice(t, "triangle", n.f, n.f * 0.97, BGM_EIGHTH * (n.len - 0.1), 0.45);
      bgmVoice(t, "sawtooth", n.f * Math.SQRT2, 0, BGM_EIGHTH * (n.len - 0.1), 0.05);
    }
    if (beat % 4 === 0) {                               // heartbeat: ba-dum every 0.8s
      bgmVoice(t, "sine", 90, 40, 0.18, 0.9);
      bgmVoice(t + 0.16, "sine", 80, 38, 0.16, 0.7);
    }
    if (beat === 6 && Math.floor(k / 8) % 2 === 0)     // thin high whine that bends down
      bgmVoice(t, "sine", 1480, 1240, 0.9, 0.05);
  }
  function bgmPlayStep(t) {
    const song = BGM_SONGS[bgm.song], k = bgm.step % song.steps.length, n = song.steps[k];
    if (song.eerie) { bgmPlayEerie(t, song, k); return; }
    if (n) bgmVoice(t, "square", n.f, 0, BGM_EIGHTH * (n.len === 1 ? song.pluck : n.len - 0.1), song.lead);
    const bar = Math.floor(k / 8), beat = k % 8;
    if (beat % 2 === 0) {                               // bass: quarters, octave bounce on the offbeat
      const root = song.roots[bar % song.roots.length];
      bgmVoice(t, "triangle", root * (beat % 4 === 2 ? 2 : 1), 0, BGM_EIGHTH * 1.8, 0.5);
    }
    if (beat % 4 === 0) bgmVoice(t, "sine", 150, 45, 0.14, 0.7);          // kick
    if (beat === 4) bgmNoise(t, 0.12, 0.22, "bandpass", 1800);             // snare
    if (beat % 2 === 1) bgmNoise(t, 0.05, 0.1, "highpass", 8000);         // hat
  }
  function bgmStart() {
    if (bgm.playing) return;
    bgm.playing = true; bgm.song = "run"; bgm.step = 0; bgm.resume = 0;
    bgm.next = audioCtx.currentTime + 0.06;
    bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bgmGain.gain.setValueAtTime(BGM_VOL, audioCtx.currentTime);
  }
  function bgmStop() {
    if (!bgm.playing) return;
    bgm.playing = false;
    const now = audioCtx.currentTime;          // fade out what is already scheduled
    droneStop(now);
    bgmGain.gain.cancelScheduledValues(now);
    bgmGain.gain.setValueAtTime(bgmGain.gain.value, now);
    bgmGain.gain.linearRampToValueAtTime(0, now + 0.12);
  }
  function bgmTick() {
    if (!audioCtx || !bgmGain) return;
    const wanted = state === STATE.PLAYING && !demoPlaying;
    if (!wanted) { bgmStop(); return; }
    bgmStart();
    const song = (zanPhase === "warning" || zanPhase === "active") ? "zan" : "run";
    // Never schedule a backlog (e.g. after the tab was suspended): restart just ahead of now.
    if (bgm.next < audioCtx.currentTime) bgm.next = audioCtx.currentTime + 0.02;
    while (bgm.next < audioCtx.currentTime + 0.15) {
      // Switch songs on a beat: enter the encounter theme from its top, and resume the
      // run theme at the start of the bar it left off.
      if (song !== bgm.song && bgm.step % 2 === 0) {
        if (song === "zan") { bgm.resume = bgm.step - bgm.step % 8; bgm.step = 0; if (!muted) droneStart(bgm.next); }
        else { bgm.step = bgm.resume; droneStop(bgm.next); }
        bgm.song = song;
      }
      if (!muted) bgmPlayStep(bgm.next);
      bgm.step++; bgm.next += BGM_EIGHTH;
    }
  }

  function setMuted(m) {
    muted = m;
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
    try { localStorage.setItem("chosu_muted", muted ? "1" : "0"); } catch (e) {}
    elMute.innerHTML = muted
      ? '<i class="fa-solid fa-volume-xmark"></i>'
      : '<i class="fa-solid fa-volume-high"></i>';
  }
  setMuted(muted); // sync icon to saved state
  elMute.addEventListener("pointerdown", (e) => {
    e.preventDefault(); e.stopPropagation();
    unlockAudio();
    setMuted(!muted);
  });

  // ===== i18n (EN / JA) =====
  const I18N = {

    if (state === STATE.OVER) { restartGame(); return; }
    if (state === STATE.PLAYING && chosu.onGround) { chosu.vy = JUMP_V; chosu.onGround = false; sfxJump(); }
  }
  function startGame() {
    demoPlaying = false; titleIdle = 0;
    elDemo.classList.add("hidden"); elHud.style.visibility = "";
    resetGame(); state = STATE.PLAYING;
    elStart.classList.add("hidden"); elOver.classList.add("hidden");
  }
  function gameOver() {
    if (demoPlaying) return; // Demo must never save a score or open the result/share screen.
    state = STATE.OVER; overShown = false; overRevealTimer = OVER_REVEAL_DELAY;
    popups = []; sfxOver();
    elOver.classList.add("hidden");
    const fs = Math.floor(score);
    overNew = fs > hiscore;
    if (overNew) { hiscore = fs; try{localStorage.setItem(HISCORE_KEY,String(hiscore));}catch(e){} }
    overNik = nikumanCount;
    overScore = fs;
    elFinal.textContent = fs;
    elHi.innerHTML = digits(hiscore);
    refreshOverTexts();
  }
  function restartGame() { if (!overShown) return; startGame(); }
  function goToTitle() {
    if (!overShown) return;
    titleIdle = 0; resetGame(); state = STATE.READY;
    elOver.classList.add("hidden"); elStart.classList.remove("hidden");
  }

  function startDemo() {
    startGame(); demoPlaying = true;
    elHud.style.visibility = "hidden";
    elDemoHint.textContent = lang === "ja"
      ? "タップ・キーでタイトルへ"
      : "Tap or press a key for title";
    elDemo.classList.remove("hidden");
  }
  function endDemo() {
    demoPlaying = false; titleIdle = 0;
    resetGame(); state = STATE.READY;
    elDemo.classList.add("hidden"); elHud.style.visibility = "";
    elOver.classList.add("hidden"); elStart.classList.remove("hidden");
  }
  function demoActivity(e) {
    titleIdle = 0;
    if (!demoPlaying) return;
    // Consume the wake-up input so it cannot also start a real game or toggle a control.
    e.preventDefault(); e.stopImmediatePropagation(); endDemo();
  }
  window.addEventListener("keydown", demoActivity, true);
  window.addEventListener("pointerdown", demoActivity, { capture: true, passive: false });
  window.addEventListener("pointermove", () => { if (state === STATE.READY) titleIdle = 0; });
  document.addEventListener("visibilitychange", () => {
    titleIdle = 0;
    // pause music (and any tail of SFX) with the hidden tab; the frame loop stops too
    if (audioCtx) { if (document.hidden) audioCtx.suspend(); else if (bgm.playing || state === STATE.PLAYING) audioCtx.resume(); }
  });
  function driveDemo() {
    if (!chosu.onGround) return;
    const playerRight = CHOSU_X + CHOSU_W - 16;
    let arrival = Infinity, height = 80;
    for (const o of obstacles) {
      if (o.x + o.w * (1 - o.def.ix) < CHOSU_X + 16) continue;
      const t = (o.x + o.w * o.def.ix - playerRight) / speed;
      if (t < arrival) { arrival = t; height = o.h * (1 - o.def.iy); }
    }
    if (zanparn && zanparn.x + zanparn.w * .78 >= CHOSU_X + 16) {
      const t = (zanparn.x + zanparn.w * .22 - playerRight) / (speed + ZANPARN_EXTRA_SPEED * speedScale);
      if (t < arrival) { arrival = t; height = ZANPARN_H; }
    }
    if (arrival <= (height > 95 ? .25 : .18)) {
      chosu.vy = JUMP_V; chosu.onGround = false;
    }
  }

  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.key === " " || e.key === "ArrowUp") {
      e.preventDefault(); unlockAudio(); onJumpInput();
    }
  });
  // Tap anywhere to jump. iOS Safari only bubbles taps up to window/document for
  // "clickable" elements; the page/canvas/overlays aren't, so a window-level
  // listener never saw taps inside the itch.io iframe (mute/lang buttons worked
  // because they have their own element listeners). So we listen on #wrap, which
  // fills the whole viewport (incl. the letterbox margins itch adds), and make it
  // clickable via cursor:pointer. Buttons inside stopPropagation, so tapping them
  // doesn't jump. touch-action:none stops the browser stealing the tap as a gesture.
  document.getElementById("wrap").addEventListener("pointerdown", (e) => {
    unlockAudio();
    if (state === STATE.OVER) return;
    e.preventDefault(); onJumpInput();
  }, { passive: false });
  function btnTap(el, fn) { el.addEventListener("pointerdown", (e)=>{ e.preventDefault(); e.stopPropagation(); fn(); }); }
  btnTap(elBtnRestart, restartGame);
  btnTap(elBtnTitle, goToTitle);
  // #btnShare is a real <a target="_blank"> (no JS click handler): its href is
  // set in refreshOverTexts() on game over, so the user's tap navigates directly.

  // render a number as fixed-width digit cells so the HUD doesn't jitter
  function digits(n) {
    return String(n).split("").map(c => '<span class="d' + (c === "1" ? " one" : "") + '">' + c + "</span>").join("");
  }
  function updateHUD() {
    elScore.innerHTML = digits(Math.floor(score));
    elNikuman.innerHTML = digits(nikumanCount);
    elHi.innerHTML = digits(hiscore);
  }
  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

  // ===== Update =====
  function update(dt) {
    if ((demoPlaying || state === STATE.READY) && document.hidden) return;
    if (state === STATE.READY && allLoaded) {
      titleIdle += dt;
      if (titleIdle >= DEMO_IDLE_SECONDS) startDemo();
    }
    if (demoPlaying) driveDemo();
    // clouds drift always (sky may move)
    const cloudSpd = (state===STATE.PLAYING)?speed:SPEED_START*speedScale*0.5;
    for (const c of clouds) c.x -= cloudSpd * c.factor * dt;
    clouds = clouds.filter(c => c.x > -260);
    while (clouds.length < 3) clouds.push(makeCloud());

    // ground-bound scenery scrolls only while playing (still on title/over)
    if (state === STATE.PLAYING) {
      environmentTime += dt;
      const region = biomeAt(CHOSU_X) - 1;
      const blendStep = 1 - Math.exp(-dt * 1.5);
      biomeBlend = biomeBlend.map((value, i) => value + ((i === region ? 1 : 0) - value) * blendStep);
      for (const t of groundTiles) t.x -= speed * dt;
      groundTiles = groundTiles.filter(t => t.x + TILE_W > -2);
      while (rightmost(groundTiles) < SPAWN_X + TILE_W) {
        const last = groundTiles[groundTiles.length - 1];
        groundTiles.push(makeGroundTile(last.x + TILE_W, last.worldX + TILE_W));
      }

    }

    if (state !== STATE.PLAYING) {
      if (state === STATE.OVER && !overShown) {
        overRevealTimer -= dt;
        if (overRevealTimer <= 0) { overShown = true; elOver.classList.remove("hidden"); }
      }
      return;
    }

    speed = Math.min(SPEED_MAX * speedScale, speed + SPEED_GROW * speedScale * dt);
    updateZanparn(dt);
    distance += speed * dt;
    score += speed * dt * 0.02;
    updateHUD();

    if (!chosu.onGround) {
      chosu.vy += GRAVITY*dt; chosu.y += chosu.vy*dt;
      if (chosu.y >= 0) { chosu.y = 0; chosu.vy = 0; chosu.onGround = true; }
    }

    runFrameTimer += dt;
    const frameDur = Math.max(0.06, 0.14 - (speed - SPEED_START*speedScale)*0.0001);
    if (runFrameTimer >= frameDur) { runFrameTimer = 0; runFrame ^= 1; if (chosu.onGround) sfxStep(); }

    const encounterActive = zanPhase !== "idle";

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (encounterActive) {
        spawnTimer = 0.15; // encounter queue controls its own hazards
      } else {
        const type = biomeAt(SPAWN_X);
        const pool = obstaclePool(type);
        const key = pick(pool), def = OB[key], h = def.h*rand(0.92,1.06), w = obstacleDrawW(key,h);
        if (zoneClearForObstacle(w)) {
          obstacles.push({ x: SPAWN_X, key, h, w, def, biome: type });
          const minGap = 0.72 + (SPEED_MAX*speedScale - speed)/(SPEED_MAX*speedScale)*0.4;
          // Give long obstacles extra passage time before the next jump.
          spawnTimer = rand(minGap, minGap+1.1) + Math.max(0, w - 120) / speed;
          if (demoPlaying) spawnTimer = Math.max(spawnTimer, 1.15);
        } else spawnTimer = 0.15;
      }
    }

    nikumanTimer -= dt;
    if (nikumanTimer <= 0) {
      if (!encounterActive && zoneClearForNikuman()) { spawnNikuman(); nikumanTimer = rand(1.4,3.0); }
      else nikumanTimer = 0.15;
    }

    for (const o of obstacles) o.x -= speed*dt;
    obstacles = obstacles.filter(o => o.x + o.w > -10);
    for (const n of nikumans) { n.x -= speed*dt; n.phase += dt*4; }
    nikumans = nikumans.filter(n => n.x + NIKUMAN_W > -10 && !n.taken);

    // collisions
    const cx = CHOSU_X+16, cy = ACTOR_FEET-CHOSU_H+chosu.y+10, cw = CHOSU_W-32, ch = CHOSU_H-18;
    for (const o of obstacles) {
      const ox = o.x + o.w*o.def.ix, ow = o.w*(1-2*o.def.ix);
      const oy = (ACTOR_FEET - o.h) + o.h*o.def.iy, oh = o.h*(1-o.def.iy);
      if (!demoPlaying && rectsOverlap(cx,cy,cw,ch, ox,oy,ow,oh)) { gameOver(); return; }
    }
    if (!demoPlaying && zanparn && rectsOverlap(cx, cy, cw, ch,
      zanparn.x + zanparn.w * 0.22, zanparnY() + 15, zanparn.w * 0.56, zanparn.h - 20)) {
      gameOver(); return;
    }
    for (const n of nikumans) {
      if (n.taken) continue;
      const bob = Math.sin(n.phase)*8;
      if (rectsOverlap(cx,cy,cw,ch, n.x+8, n.y+bob+8, NIKUMAN_W-16, NIKUMAN_H-16)) {
        n.taken = true; nikumanCount++; score += 100; updateHUD(); sfxGet();
        popups.push({ x: n.x + NIKUMAN_W/2, y: n.y + NIKUMAN_H/2 + bob, t: 0 });
      }
    }

    for (const p of popups) { p.x -= speed*dt; p.t += dt; }
    popups = popups.filter(p => p.t < POPUP_LIFE);
  }
  function rightmost(list){ let m=-Infinity; for(const it of list) if(it.x>m) m=it.x; return m===-Infinity?-TILE_W:m; }

  // ===== Drawing =====
  function mixColor(a, b, t) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * t));
  }
  function skyColor(key, night) {
    let color = [0, 0, 0];
    BIOMES.forEach((biome, i) => biome[key].forEach((v, c) => color[c] += v * biomeBlend[i]));
    const dusk = Math.max(0, 1 - Math.abs(night - 0.45) / 0.4) * 0.7;
    color = mixColor(color, key === "sky" ? [171,139,191] : [255,191,153], dusk);
    return "rgb(" + mixColor(color, key === "sky" ? [29,44,83] : [104,135,167], night).join(",") + ")";
  }
  // Fixed star field: one star per horizontal slot, jittered by a hash, so no
  // screen width lines them up into columns (a modulo pattern did on 686px).
  const STARS = Array.from({ length: 38 }, (_, i) => {
    const hash = n => { const v = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return v - Math.floor(v); };
    return { fx: (i + 0.1 + hash(1) * 0.8) / 38, y: 80 + Math.round(hash(2) * 250) };
  });
  function drawSky(night) {
    const g = ctx.createLinearGradient(0, 0, 0, FEET_Y);
    g.addColorStop(0, skyColor("sky", night)); g.addColorStop(1, skyColor("horizon", night));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = night * 0.85;
    ctx.fillStyle = "#f5f4df";
    for (let i = 0; i < STARS.length; i++) {
      const x = Math.round(STARS[i].fx * W), y = STARS[i].y;
      const size = i % 7 === 0 ? 3 : 2;
      ctx.fillRect(x, y, size, size);
      if (size === 3) { ctx.fillRect(x - 3, y + 1, 9, 1); ctx.fillRect(x + 1, y - 3, 1, 9); }
    }
    ctx.restore();
  }
  // Mirror alternate repeats so both edges meet exactly, including irregular
  // coastlines. Source PNGs retain alpha; the live day/night sky shows through.
  function drawSceneryRepeat(im, sx, sy, sw, sh, x, y, w, h, mirrored) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(Math.round(x) + (mirrored ? w : 0), y);
    if (mirrored) ctx.scale(-1, 1);
    // Integer-aligned repeats meet exactly. Overscan would paint the shared
    // column twice and create a dark seam while globalAlpha is below one.
    drawSource(im, sx, sy, sw, sh, 0, 0, w, h);
    ctx.restore();
  }
  const SCENERY_FAR_SPEED = 0.18, SCENERY_NEAR_SPEED = 0.34;
  const SCENERY = [
    { key: "scenery/plains", peak: 635, edge: "#80532f", light: "#e4b574" },
    { key: "scenery/desert", peak: 615, edge: "#c59e64", light: "#ffe4a0" },
    { key: "scenery/seaside", peak: 600, edge: "#c5a375", light: "#ffe6ab" },
    { key: "scenery/snowfield", peak: 588, edge: "#b2c6d4", light: "#f3f9ff" },
    { key: "scenery/halloween", peak: 638, edge: "#80583e", light: "#dbad75" },
    { key: "scenery/christmas", peak: 620, preserveAspect: true, edge: "#a8bebd", light: "#fff5df" }
  ];
  const SCENERY_PEAK_HEIGHT = 128;
  function drawRegionScenery(type) {
    const { key, peak, preserveAspect } = SCENERY[type - 1];
    const im = img(key);
    if (!ready(im)) return;
    const sourceTop = peak - 80;
    // Keep the festive trees/houses proportional at the established skyline height.
    // Integer repeat widths also keep mirrored tile boundaries pixel-aligned.
    const width = preserveAspect ? Math.round(1536 * SCENERY_PEAK_HEIGHT / (900 - peak)) : 960;
    const height = preserveAspect ? (900 - sourceTop) * width / 1536
      : SCENERY_PEAK_HEIGHT * (900 - sourceTop) / (900 - peak);
    const offset = distance * SCENERY_FAR_SPEED;
    const first = Math.floor(offset / width);
    for (let i = first; i * width - offset < W; i++) {
      drawSceneryRepeat(im, 0, sourceTop, 1536, 900 - sourceTop,
        i * width - offset, FEET_Y - height, width, height, i % 2 !== 0);
    }
  }
  function drawRegionNear(type) {
    if (type === 3) {
      const im = img("scenery/seaside");
      if (!ready(im)) return;
      // The island shore ends at source row 711. Start within the water so
      // no island pixels drift with this faster layer; keep the shoreline fixed.
      const sourceTop = 716, sourceHeight = 900 - sourceTop;
      const width = 960, offset = distance * SCENERY_NEAR_SPEED;
      const height = sourceHeight * SCENERY_PEAK_HEIGHT / (900 - SCENERY[2].peak);
      for (let i = Math.floor(offset / width); i * width - offset < W; i++) {
        drawSceneryRepeat(im, 0, sourceTop, 1536, sourceHeight,
          i * width - offset, FEET_Y - height, width, height, i % 2 !== 0);
      }
    }
  }
  function drawGround(tile) {
    const config = SCENERY[tile.type - 1];
    const im = img(config.key);
    if (!ready(im)) return;
    const mirrored = Math.abs(Math.round(tile.worldX / TILE_W)) % 2 !== 0;
    drawSceneryRepeat(im, 0, 920, 1536, 104,
      tile.x, FEET_Y, TILE_W, H - FEET_Y, mirrored);
    // Match the dark top edge on the original ground tiles.
    ctx.fillStyle = config.edge;
    ctx.fillRect(Math.round(tile.x), FEET_Y, TILE_W + 1, 3);
    ctx.fillStyle = config.light;
    ctx.fillRect(Math.round(tile.x), FEET_Y + 3, TILE_W + 1, 3);
  }
  function drawBackground() {
    const night = nightAmount();
    drawSky(night);
    ctx.save();
    for (let type = 1; type <= BIOMES.length; type++) {
      if (biomeBlend[type - 1] < 0.001) continue;
      ctx.globalAlpha = biomeBlend[type - 1];
      drawRegionScenery(type); drawRegionNear(type);
    }
    ctx.restore();

    // Flatten opaque clouds first, then fade the entire layer once. Applying
    // night opacity per sprite makes intersections darker than a single cloud.
    if (cloudLayer.width !== W * PX || cloudLayer.height !== H * PX) {
      cloudLayer.width = W * PX; cloudLayer.height = H * PX;
    }
    cloudCtx.setTransform(PX, 0, 0, PX, 0, 0);
    cloudCtx.clearRect(0, 0, W, H);
    cloudCtx.globalAlpha = 1;
    for (const c of clouds) {
      const im = img(c.key);
      if (ready(im)) cloudCtx.drawImage(im, c.x, c.y, im.naturalWidth*c.scale, im.naturalHeight*c.scale);
    }
    ctx.save();
    ctx.globalAlpha = 1 - night * 0.55;
    ctx.drawImage(cloudLayer, 0, 0, W, H);
    ctx.restore();

    for (const t of groundTiles) drawGround(t);
    // Shade only the landscape: player, pickups, obstacles and HUD stay readable.
    const shade = ctx.createLinearGradient(0, FEET_Y - 210, 0, FEET_Y);
    shade.addColorStop(0, "rgba(27,42,83,0)");
    shade.addColorStop(1, "rgba(27,42,83," + night * 0.25 + ")");
    ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = (biomeBlend[3] + biomeBlend[5]) * 0.7;
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 35; i++) {
      const x = ((i * 163 + Math.sin(environmentTime * 0.5 + i) * 16 - environmentTime * 12) % W + W) % W;
      const y = 65 + ((i * 89 + environmentTime * (12 + i % 5)) % (FEET_Y - 65));
      ctx.fillRect(Math.round(x), Math.round(y), i % 3 === 0 ? 4 : 2, i % 3 === 0 ? 4 : 2);
    }
    ctx.restore();
  }
  function drawObstacleSprite(key, x, y, w, h) {
    const im = img(OB[key].asset || key);
    if (!ready(im)) return;
    const crop = OB[key].crop;
    if (crop) {
      ctx.save(); ctx.imageSmoothingEnabled = false;
      drawSource(im, ...crop, x, y, w, h); ctx.restore();
    } else ctx.drawImage(im, x, y, w, h);
  }
  function drawObstacle(o) {
    drawObstacleSprite(o.key, o.x, ACTOR_FEET - o.h, o.w, o.h);
  }

  function drawNikuman(n) {
    if (n.taken) return;
    const bob = Math.sin(n.phase)*8, sq = Math.sin(n.phase)*0.10;
    const w = NIKUMAN_W*(1+sq), h = NIKUMAN_H*(1-sq);
    const cx = n.x + NIKUMAN_W/2, cy = n.y + NIKUMAN_H/2 + bob;
    const im = img("nikuman00");
    if (ready(im)) ctx.drawImage(im, cx-w/2, cy-h/2, w, h);
  }

  function drawChosu() {
    if (state === STATE.READY) return; // HTML title chosu used instead
    let im;
    if (state === STATE.OVER) im = img("chosu03");
    else if (!chosu.onGround) im = img("chosu01");
    else im = (runFrame===0) ? img("chosu01") : img("chosu02");
    const x = CHOSU_X, y = ACTOR_FEET - CHOSU_H + chosu.y;
    const sh = 1 - Math.min(0.6, (-chosu.y)/300);
    ctx.fillStyle = "rgba(65,39,33,0.18)";
    ctx.beginPath();
    ctx.ellipse(x+CHOSU_W/2, ACTOR_FEET+6, (CHOSU_W/2.4)*sh, 10*sh, 0, 0, Math.PI*2);
    ctx.fill();
    if (ready(im)) ctx.drawImage(im, x, y, CHOSU_W, CHOSU_H);
  }

  function drawPopups() {
    if (!popups.length) return;
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of popups) {
      const k = p.t / POPUP_LIFE;
      const rise = -44 * k;                          // float upward
      const a = k < 0.55 ? 1 : Math.max(0, 1 - (k - 0.55) / 0.45); // hold then fade
      const pop = k < 0.14 ? 1.3 - 0.3 * (k / 0.14) : 1.0;          // quick overshoot
      const fs = Math.round(30 * pop);
      ctx.globalAlpha = a;
      ctx.font = "700 " + fs + "px 'Pixelify Sans', sans-serif";
      ctx.lineWidth = 6;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#fbf5e7";                   // cream outline
      ctx.strokeText("+100", p.x, p.y + rise);
      ctx.fillStyle = "#412721";                     // brown fill
      ctx.fillText("+100", p.x, p.y + rise);
    }
    ctx.restore();
  }

  function render() {
    elHud.classList.toggle("night", nightAmount() > 0.45);
    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    ctx.imageSmoothingQuality = "high";   // ちょす is drawn well below its source size
    ctx.clearRect(0,0,W,H);
    drawBackground();
    for (const n of nikumans) drawNikuman(n);
    for (const o of obstacles) drawObstacle(o);
    drawChosu();
    if (zanparn) {
      const im = img("zanparn");
      if (ready(im)) {
        ctx.save(); ctx.imageSmoothingEnabled = false;
        ctx.drawImage(im, zanparn.x, zanparnY(), zanparn.w, zanparn.h);
        ctx.restore();
      }
    }
    drawPopups();
  }

  // ===== Loop =====
  function loop(t) {
    if (!lastTime) lastTime = t;
    let dt = (t-lastTime)/1000; lastTime = t;
    if (dt > 0.05) dt = 0.05;
    update(dt); render(); bgmTick();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", () => configureMode(false));
  configureMode(true);
  biomeBlend = BIOMES.map((_, i) => i === biomeAt(CHOSU_X) - 1 ? 1 : 0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
