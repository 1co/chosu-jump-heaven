<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="author" content="ichiha">
<meta name="copyright" content="© 2026 ichiha. All rights reserved.">
<title>CHOSU JUMP HEAVEN ちょすのジャンプ天国</title>
<!-- Icons: place these image files next to index.html on the server -->
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Pixelify+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root {
    --cream:   #fbf5e7;
    --pink:    #f1beb9;
    --mint:    #b8e9e5;
    --yellow:  #ffe555;
    --brown:   #412721;
    --sky-top: #afe6ff;
    --sky-bot: #d3f6ff;
    --pad: clamp(10px, 3vw, 20px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--brown);
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--brown);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #wrap {
    width: 100%;
    height: 100%;
    padding: var(--pad);
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 40%),
      var(--brown);
  }
  /* PC: 4:3 */
  #stage {
    position: relative;
    width: min(100%, calc((100vh - var(--pad) * 2) * 4 / 3));
    width: min(100%, calc((100dvh - var(--pad) * 2) * 4 / 3));
    max-width: 800px;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 0 0 6px var(--cream), 0 0 0 10px var(--brown);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bot));
  }
  /* SP: a little taller (≈8:7) */
  @media (max-width: 700px) {
    #stage {
      width: min(100%, calc((100vh - var(--pad) * 2) * 686 / 600));
      width: min(100%, calc((100dvh - var(--pad) * 2) * 686 / 600));
      aspect-ratio: 686 / 600;
    }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---- Overlays ---- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    gap: 20px;                 /* ~20px between the windows */
    z-index: 5;
  }
  .overlay.hidden { display: none; }

  .logo { height: auto; image-rendering: auto; filter: drop-shadow(0 4px 0 rgba(65,39,33,.15)); margin-bottom: 10px; } /* gameover: +gap = ~30px below the logo */
  .logo-title    { width: min(66%, 540px); margin-top: -6%; margin-bottom: 0; } /* title logo -> subtitle = gap (20px) */
  .logo-gameover { width: min(46%, 360px); }
  @media (max-width: 700px) {
    .overlay { gap: 14px; }
    .logo-title    { width: 86%; }
    .logo-gameover { width: 62%; margin-bottom: 4px; } /* keep a little space below the GAME OVER logo on SP */
  }

  .subtitle {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 3vw, 22px);
    color: var(--brown);
    background: var(--yellow);
    padding: 5px 18px;
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(65,39,33,.18);
    margin-bottom: 10px;   /* subtitle -> instruction window = gap + 10 = ~30px */
  }

  .panel {
    background: rgba(251,245,231,.94);
    border: 3px solid var(--brown);
    border-radius: 14px;
    padding: 10px 16px;
    box-shadow: 0 6px 0 rgba(65,39,33,.22);
    max-width: 92%;
  }
  /* keep the score window a stable size regardless of the message inside */
  #overScreen .panel { min-width: 230px; font-weight: 700; } /* labels = 700 */
  .num { font-weight: 900; }                                  /* numbers = 900 */
  .hint {
    font-size: clamp(12px, 2.4vw, 15px);
    line-height: 1.6;
    font-weight: 500;
  }
  .hint p { margin: 0; }
  /* keycaps + text on one line, vertically centered together */
  .hint-keys {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .hint-sub { margin-top: 6px; } /* a little breathing room above the second line */
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82em;     /* same on both keys -> identical box height */
    height: 1.9em;
    min-width: 1.7em;
    padding: 0 8px;
    margin: 0 2px;
    line-height: 1;
    vertical-align: middle;
    background: var(--mint);
    border: 2px solid var(--brown);
    border-radius: 6px;
    box-shadow: 0 2px 0 var(--brown);
  }
  .key-space { font-family: 'Silkscreen', sans-serif; }
  .key-up    { font-family: 'DotGothic16', sans-serif; }

  .blink {
    font-weight: 700;
    font-size: clamp(15px, 3vw, 20px);
    color: var(--brown);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .mute {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 7;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--brown);
    background: rgba(251,245,231,.85);
    border: 2px solid var(--brown);
    border-radius: 8px;
    box-shadow: 0 2px 0 var(--brown);
    cursor: pointer;
    pointer-events: auto;
  }
  .mute:active { transform: translateY(2px); box-shadow: 0 0 0 var(--brown); }

  .version {
    position: absolute;
    right: 12px;
    bottom: 10px;
    font-family: 'Pixelify Sans', sans-serif;
    font-size: clamp(10px, 2vw, 13px);
    color: var(--brown);
    opacity: .45;
    pointer-events: none;
  }

  /* title-screen chosu shown in front of the instructions */
  #titleChosu {
    position: absolute;
    left: 15%;            /* = CHOSU_X / W */
    bottom: 6%;           /* = (600 - ACTOR_FEET) / 600, so it matches the in-game stance */
    width: 12%;           /* PC: 96 / 800 — same as the in-game ちょす */
    height: auto;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 6px 0 rgba(65,39,33,.12));
  }
  @media (max-width: 700px) {
    #titleChosu { width: 14%; }  /* SP: 96 / 686 — match the (relatively bigger) in-game ちょす */
  }
  #titleNikuman {
    position: absolute;
    right: 13%;
    bottom: 26%;
    width: 9%;
    height: auto;
    pointer-events: none;
    transform-origin: center center;
    filter: drop-shadow(0 6px 0 rgba(65,39,33,.12));
    animation: ponyon 1.6s ease-in-out infinite;
  }
  @keyframes ponyon {
    0%   { transform: translateY(0)    scale(1, 1); }
    25%  { transform: translateY(8px)  scale(1.1, 0.9); }
    50%  { transform: translateY(0)    scale(1, 1); }
    75%  { transform: translateY(-8px) scale(0.9, 1.1); }
    100% { transform: translateY(0)    scale(1, 1); }
  }

  .btnrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 2.8vw, 18px);
    color: var(--brown);
    background: var(--yellow);
    border: 3px solid var(--brown);
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--brown);
    transition: transform .05s ease, box-shadow .05s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown); }
  .btn.secondary { background: var(--mint); }
  .key-hint { font-size: clamp(11px, 2.4vw, 14px); color: var(--brown); opacity: .8; font-weight: 500; }

  /* ---- HUD ---- */
  #hud {
    position: absolute;
    top: 10px; left: 14px; right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: 'Pixelify Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 3vw, 20px);
    color: var(--brown);
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
    z-index: 4;
    pointer-events: none;
    letter-spacing: .5px;
  }
  #hud .right { text-align: right; line-height: 1.15; }
  #hud .hi { color: #d98a2b; }
  /* fixed-width digit cells so numbers don't jitter as values change */
  #hud .d { display: inline-block; width: 0.62em; text-align: center; }
  .nikuman-count { display: inline-flex; align-items: center; gap: 3px; }
  .nikuman-count img { height: 1.5em; width: auto; vertical-align: middle; }

  /* ---- Phone landscape lock ---- */
  #rotateLock {
    display: none;
    position: fixed; inset: 0;
    background: var(--brown);
    color: var(--cream);
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
  }
  #rotateLock i { font-size: 16vw; animation: tilt 1.6s ease-in-out infinite; }
  #rotateLock .msg { font-size: 5vw; line-height: 1.5; }
  @keyframes tilt { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
    #rotateLock { display: flex; }
  }

  /* ---- Loading screen ---- */
  #loading {
    position: fixed; inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--brown);
    transition: opacity .35s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loadingNikuman { width: 72px; height: auto; transform-origin: center center; animation: ponyon 1.6s ease-in-out infinite; }
  #loading .loading-text {
    font-family: 'Pixelify Sans', sans-serif;
    color: var(--cream);
    font-size: 16px;
    letter-spacing: 2px;
    opacity: .85;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="800" height="600"></canvas>

    <div id="hud">
      <div class="left">
        <span class="nikuman-count"><img id="hudNikuman" alt="にくまん">×<span id="nikumanCount">0</span></span>
      </div>
      <div class="right">
        <div>SCORE <span id="score">0</span></div>
        <div class="hi">HI <span id="hiscore">0</span></div>
      </div>
    </div>

    <!-- Start screen -->
    <div id="startScreen" class="overlay">
      <img class="logo logo-title" id="logoTitle" alt="CHOSU JUMP HEAVEN">
      <div class="subtitle">ちょすのジャンプ天国</div>
      <div class="panel hint">
        <p class="hint-keys"><span class="key key-space">SPACE</span> / <span class="key key-up">↑</span> / タップでジャンプ</p>
        <p class="hint-sub">にくまんを集めて、障害物をよけよう！</p>
      </div>
      <div class="blink"><i class="fa-solid fa-play"></i> おして スタート</div>
      <img id="titleChosu" alt="ちょす">
      <img id="titleNikuman" alt="にくまん">
      <div class="version">v0.11.0</div>
    </div>

    <!-- Game over screen -->
    <div id="overScreen" class="overlay hidden">
      <img class="logo logo-gameover" id="logoGameover" alt="GAME OVER">
      <div class="panel">
        <div class="score-line">スコア</div>
        <div class="score-big num" id="finalScore" style="font-family:'Zen Maru Gothic',sans-serif;font-size:clamp(26px,5.5vw,36px);line-height:1.1;">0</div>
        <div class="score-line" style="margin-top:4px;">にくまん <span id="finalNikuman" class="num">0</span> こ</div>
        <div class="score-line hi" id="finalHi" style="color:#d98a2b;"></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="btnRestart"><i class="fa-solid fa-rotate-right"></i> もう一度</button>
        <button class="btn secondary" id="btnTitle"><i class="fa-solid fa-house"></i> タイトルに戻る</button>
      </div>
    </div>

    <button id="muteBtn" class="mute" aria-label="サウンド切替"><i class="fa-solid fa-volume-high"></i></button>
  </div>
</div>

<!-- loading screen: covers the layout flash until assets/fonts are ready -->
<div id="loading">
  <img id="loadingNikuman" alt="">
  <div class="loading-text">Loading…</div>
</div>

<!-- shown only when a phone is held in landscape -->
<div id="rotateLock">
  <i class="fa-solid fa-mobile-screen-button"></i>
  <div class="msg">たてむきにして<br>あそんでね</div>
</div>

  // ===== Audio (Web Audio synthesis — no files, stays self-contained) =====
  let audioCtx = null, masterGain = null, muted = false;
  try { muted = localStorage.getItem("chosu_muted") === "1"; } catch (e) {}

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(audioCtx.destination);
  }
  function unlockAudio() {           // must run inside a user gesture
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  // one tone with optional frequency sweep + a quick attack/decay envelope
  function tone(o) {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime + (o.delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = o.type || "square";
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1 != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    const vol = o.vol != null ? o.vol : 0.4;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + o.dur + 0.03);
  }

  // ===== Scenery factories =====
  function makeCloud(x) {
    return { x: x!==undefined?x:W+rand(0,200), y: rand(30, FEET_Y-260),
             scale: rand(0.50,0.60), factor: rand(0.12,0.3), key: pick(POOL_CLOUD) };

  function makeGrass(x) {
    return { x: x!==undefined?x:W+rand(60,340), key: pick(POOL_GRASS), s: rand(0.45,0.7) };
  }
  function makeGroundTile(x) { return { x, type: Math.random()<0.5?1:2 }; }

  function seedScenery() {
    // mountains: tiled layers
    mtnFar = []; mtnNear = [];
    const farW = mtnW("background/background01", MTN_FAR_H);
    for (let x=-farW; x < W+farW; x+=farW) mtnFar.push({x, key:"background/background01"});
    const nearW = mtnW("background/background02", MTN_NEAR_H);
    for (let x=-nearW; x < W+nearW; x+=nearW) mtnNear.push({x, key:"background/background02"});

    clouds = []; for (let i=0;i<3;i++) clouds.push(makeCloud(rand(0,W)));
    grass = [];  for (let i=0;i<5;i++) grass.push(makeGrass(rand(0,W)));

    groundTiles = [];
    let gx = -TILE_W;
    while (gx < SPAWN_X + TILE_W) { groundTiles.push(makeGroundTile(gx)); gx += TILE_W; }
  }

    obstacles = []; nikumans = []; popups = [];
    spawnTimer = rand(0.7, 1.1);
    nikumanTimer = rand(1.2, 2.2);
    runFrame = 0; runFrameTimer = 0;
    updateHUD();
  }

  // ===== Biome / spawning =====
  function biomeAt(px) {
    for (const t of groundTiles) if (t.x <= px && px < t.x + TILE_W) return t.type;
    return 1;
  }
  function obstacleDrawW(key, h) {
    const im = img(key);
    const r = ready(im) ? im.naturalWidth/im.naturalHeight : 1;
    return h * r;
  }
  function spawnObstacle() {
    const type = biomeAt(SPAWN_X);
    const pool = (type === 1) ? POOL_ROCK.concat(POOL_TREE) : POOL_ROCK.concat(POOL_CACTUS);
    const key = pick(pool);
    const def = OB[key];
    const h = def.h * rand(0.92, 1.06);
    obstacles.push({ x: SPAWN_X, key, h, w: obstacleDrawW(key, h), def });
  }
  function spawnNikuman() {
    nikumans.push({ x: SPAWN_X, y: FEET_Y - rand(110,190), phase: rand(0,Math.PI*2), taken:false });
  }
  function zoneClearForNikuman() {
    for (const o of obstacles)
      if (o.x + o.w + 150 > SPAWN_X && o.x - 150 < SPAWN_X + NIKUMAN_W) return false;
    return true;
  }
  function zoneClearForObstacle(w) {
    for (const n of nikumans)
      if (n.x + NIKUMAN_W + 150 > SPAWN_X && n.x - 150 < SPAWN_X + w) return false;
    return true;
  }

  // ===== Input =====
  function onJumpInput() {
    if (!allLoaded) return;
    if (state === STATE.READY) { startGame(); return; }
    if (state === STATE.OVER) { restartGame(); return; }
    if (state === STATE.PLAYING && chosu.onGround) { chosu.vy = JUMP_V; chosu.onGround = false; sfxJump(); }
  }
  function startGame() {
    resetGame(); state = STATE.PLAYING;
    elStart.classList.add("hidden"); elOver.classList.add("hidden");
  }
  function gameOver() {
    state = STATE.OVER; overShown = false; overRevealTimer = OVER_REVEAL_DELAY;
    popups = []; sfxOver();
    elOver.classList.add("hidden");
    const fs = Math.floor(score);
    if (fs > hiscore) { hiscore = fs; try{localStorage.setItem(HISCORE_KEY,String(hiscore));}catch(e){}
      elFinalHi.textContent = "★ ハイスコアこうしん！ ★"; }
    else elFinalHi.innerHTML = 'ハイスコア <span class="num">' + hiscore + "</span>";
    elFinal.textContent = fs; elFinalN.textContent = nikumanCount; elHi.innerHTML = digits(hiscore);
  }
  function restartGame() { if (!overShown) return; startGame(); }
  function goToTitle() {
    if (!overShown) return;
    resetGame(); seedScenery(); state = STATE.READY;
    elOver.classList.add("hidden"); elStart.classList.remove("hidden");
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.key === " " || e.key === "ArrowUp") {
      e.preventDefault(); unlockAudio(); onJumpInput();
    }
  });
  window.addEventListener("pointerdown", (e) => {
    unlockAudio();
    if (state === STATE.OVER) return;
    e.preventDefault(); onJumpInput();
  }, { passive: false });
  function btnTap(el, fn) { el.addEventListener("pointerdown", (e)=>{ e.preventDefault(); e.stopPropagation(); fn(); }); }
  btnTap(elBtnRestart, restartGame);
  btnTap(elBtnTitle, goToTitle);

  // render a number as fixed-width digit cells so the HUD doesn't jitter
  function digits(n) {
    return String(n).split("").map(c => '<span class="d">' + c + "</span>").join("");
  }
  function updateHUD() {
    elScore.innerHTML = digits(Math.floor(score));
    elNikuman.innerHTML = digits(nikumanCount);
    elHi.innerHTML = digits(hiscore);
  }
  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

  // ===== Update =====
  function update(dt) {
    // clouds drift always (sky may move)
    const cloudSpd = (state===STATE.PLAYING)?speed:SPEED_START*speedScale*0.5;
    for (const c of clouds) c.x -= cloudSpd * c.factor * dt;
    clouds = clouds.filter(c => c.x > -260);
    while (clouds.length < 3) clouds.push(makeCloud());

    // ground-bound scenery scrolls only while playing (still on title/over)
    if (state === STATE.PLAYING) {
      const farW = mtnW("background/background01",MTN_FAR_H), nearW = mtnW("background/background02",MTN_NEAR_H);
      for (const m of mtnFar)  m.x -= speed * 0.18 * dt;
      for (const m of mtnNear) m.x -= speed * 0.34 * dt;
      mtnFar  = mtnFar.filter(m => m.x + farW > -2);  while (rightmost(mtnFar)  < W) mtnFar.push({x: rightmost(mtnFar)+farW,   key:"background/background01"});
      mtnNear = mtnNear.filter(m => m.x + nearW > -2); while (rightmost(mtnNear) < W) mtnNear.push({x: rightmost(mtnNear)+nearW, key:"background/background02"});

      for (const t of groundTiles) t.x -= speed * dt;
      groundTiles = groundTiles.filter(t => t.x + TILE_W > -2);
      while (rightmost(groundTiles) < SPAWN_X + TILE_W) groundTiles.push(makeGroundTile(rightmost(groundTiles)+TILE_W));

      for (const g of grass) g.x -= speed * dt;
      grass = grass.filter(g => g.x > -60); while (grass.length < 5) grass.push(makeGrass());
    }

    if (state !== STATE.PLAYING) {
      if (state === STATE.OVER && !overShown) {
        overRevealTimer -= dt;
        if (overRevealTimer <= 0) { overShown = true; elOver.classList.remove("hidden"); }
      }
      return;
    }

    speed = Math.min(SPEED_MAX*speedScale, speed + SPEED_GROW*speedScale*dt);
    distance += speed * dt;
    score += speed * dt * 0.02;
    updateHUD();

    if (!chosu.onGround) {
      chosu.vy += GRAVITY*dt; chosu.y += chosu.vy*dt;
      if (chosu.y >= 0) { chosu.y = 0; chosu.vy = 0; chosu.onGround = true; }
    }

    runFrameTimer += dt;
    const frameDur = Math.max(0.06, 0.14 - (speed - SPEED_START*speedScale)*0.0001);
    if (runFrameTimer >= frameDur) { runFrameTimer = 0; runFrame ^= 1; if (chosu.onGround) sfxStep(); }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const type = biomeAt(SPAWN_X);
      const pool = (type===1)?POOL_ROCK.concat(POOL_TREE):POOL_ROCK.concat(POOL_CACTUS);
      const key = pick(pool), def = OB[key], h = def.h*rand(0.92,1.06), w = obstacleDrawW(key,h);
      if (zoneClearForObstacle(w)) {
        obstacles.push({ x: SPAWN_X, key, h, w, def });
        const minGap = 0.72 + (SPEED_MAX*speedScale - speed)/(SPEED_MAX*speedScale)*0.4;
        spawnTimer = rand(minGap, minGap+1.1);
      } else spawnTimer = 0.15;
    }

    nikumanTimer -= dt;
    if (nikumanTimer <= 0) {
      if (zoneClearForNikuman()) { spawnNikuman(); nikumanTimer = rand(1.4,3.0); }
      else nikumanTimer = 0.15;
    }

    for (const o of obstacles) o.x -= speed*dt;
    obstacles = obstacles.filter(o => o.x + o.w > -10);
    for (const n of nikumans) { n.x -= speed*dt; n.phase += dt*4; }
    nikumans = nikumans.filter(n => n.x + NIKUMAN_W > -10 && !n.taken);

    // collisions
    const cx = CHOSU_X+16, cy = ACTOR_FEET-CHOSU_H+chosu.y+10, cw = CHOSU_W-32, ch = CHOSU_H-18;
    for (const o of obstacles) {
      const ox = o.x + o.w*o.def.ix, ow = o.w*(1-2*o.def.ix);
      const oy = (ACTOR_FEET - o.h) + o.h*o.def.iy, oh = o.h*(1-o.def.iy);
      if (rectsOverlap(cx,cy,cw,ch, ox,oy,ow,oh)) { gameOver(); return; }
    }
    for (const n of nikumans) {
      if (n.taken) continue;
      const bob = Math.sin(n.phase)*8;
      if (rectsOverlap(cx,cy,cw,ch, n.x+8, n.y+bob+8, NIKUMAN_W-16, NIKUMAN_H-16)) {
        n.taken = true; nikumanCount++; score += 100; updateHUD(); sfxGet();
        popups.push({ x: n.x + NIKUMAN_W/2, y: n.y + NIKUMAN_H/2 + bob, t: 0 });
      }
    }

    for (const p of popups) { p.x -= speed*dt; p.t += dt; }
    popups = popups.filter(p => p.t < POPUP_LIFE);
  }
  function rightmost(list){ let m=-Infinity; for(const it of list) if(it.x>m) m=it.x; return m===-Infinity?-TILE_W:m; }

  // ===== Drawing =====
  function drawBackground() {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#afe6ff"); g.addColorStop(1, "#d3f6ff");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    ctx.globalAlpha = 0.9;
    drawMtnLayer(mtnFar, MTN_FAR_H);
    ctx.globalAlpha = 1;
    drawMtnLayer(mtnNear, MTN_NEAR_H);

    for (const c of clouds) {
      const im = img(c.key);
      if (ready(im)) ctx.drawImage(im, c.x, c.y, im.naturalWidth*c.scale, im.naturalHeight*c.scale);
    }

    // ground tiles — clear biome boundaries, with a 1px overlap so no gap shows
    for (const t of groundTiles) {
      const im = img(t.type === 1 ? "ground/ground01" : "ground/ground02");
      if (ready(im)) ctx.drawImage(im, Math.round(t.x), GROUND_TOP, TILE_W + 1, TILE_H);
    }
    // grass on the surface
    for (const gr of grass) {
      const im = img(gr.key);
      if (ready(im)) {
        const w = im.naturalWidth*gr.s, h = im.naturalHeight*gr.s;
        ctx.drawImage(im, gr.x, FEET_Y - h + 6, w, h);
      }
    }
  }
  function drawMtnLayer(list, drawH) {
    for (const m of list) {
      const im = img(m.key);
      if (!ready(im)) continue;
      const w = drawH * im.naturalWidth/im.naturalHeight;
      ctx.drawImage(im, m.x, (FEET_Y + MTN_SINK) - drawH, w, drawH);
    }
  }

  function drawObstacle(o) {
    const im = img(o.key);
    const y = ACTOR_FEET - o.h;
    if (ready(im)) ctx.drawImage(im, o.x, y, o.w, o.h);
  }

  function drawNikuman(n) {
    if (n.taken) return;
    const bob = Math.sin(n.phase)*8, sq = Math.sin(n.phase)*0.10;
    const w = NIKUMAN_W*(1+sq), h = NIKUMAN_H*(1-sq);
    const cx = n.x + NIKUMAN_W/2, cy = n.y + NIKUMAN_H/2 + bob;
    const im = img("nikuman00");
    if (ready(im)) ctx.drawImage(im, cx-w/2, cy-h/2, w, h);
  }

  function drawChosu() {
    if (state === STATE.READY) return; // HTML title chosu used instead
    let im;
    if (state === STATE.OVER) im = img("chosu03");
    else if (!chosu.onGround) im = img("chosu01");
    else im = (runFrame===0) ? img("chosu01") : img("chosu02");
    const x = CHOSU_X, y = ACTOR_FEET - CHOSU_H + chosu.y;
    const sh = 1 - Math.min(0.6, (-chosu.y)/300);
    ctx.fillStyle = "rgba(65,39,33,0.18)";
    ctx.beginPath();
    ctx.ellipse(x+CHOSU_W/2, ACTOR_FEET+6, (CHOSU_W/2.4)*sh, 10*sh, 0, 0, Math.PI*2);
    ctx.fill();
    if (ready(im)) ctx.drawImage(im, x, y, CHOSU_W, CHOSU_H);
  }

  function drawPopups() {
    if (!popups.length) return;
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of popups) {
      const k = p.t / POPUP_LIFE;
      const rise = -44 * k;                          // float upward
      const a = k < 0.55 ? 1 : Math.max(0, 1 - (k - 0.55) / 0.45); // hold then fade
      const pop = k < 0.14 ? 1.3 - 0.3 * (k / 0.14) : 1.0;          // quick overshoot
      const fs = Math.round(30 * pop);
      ctx.globalAlpha = a;
      ctx.font = "700 " + fs + "px 'Pixelify Sans', sans-serif";
      ctx.lineWidth = 6;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#fbf5e7";                   // cream outline
      ctx.strokeText("+100", p.x, p.y + rise);
      ctx.fillStyle = "#412721";                     // brown fill
      ctx.fillText("+100", p.x, p.y + rise);
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0,0,W,H);
    drawBackground();
    for (const n of nikumans) drawNikuman(n);
    for (const o of obstacles) drawObstacle(o);
    drawChosu();
    drawPopups();
  }

  // ===== Loop =====
  function loop(t) {
    if (!lastTime) lastTime = t;
    let dt = (t-lastTime)/1000; lastTime = t;
    if (dt > 0.05) dt = 0.05;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", () => configureMode(false));
  configureMode(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
